version: 2

project_name: planlens

before:
  hooks:
    - go mod tidy

builds:
  - id: planlens
    main: ./cmd/planlens
    binary: planlens
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X planlens/internal/cli.Version={{.Version}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ title .Os }}_{{ if eq .Arch "amd64" }}x86_64{{ else if eq .Arch "arm64" }}aarch64{{ else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

homebrew_casks:
  - name: planlens
    repository:
      owner: ojarosch
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    commit_msg_template: "Brew cask update for {{ .ProjectName }} version {{ .Tag }}"
    directory: Casks
    homepage: "https://github.com/ojarosch/planlens"
    description: "Reviewer-oriented semantic diff for Terraform/OpenTofu plans"
    license: "Apache-2.0"
    binaries:
      - planlens
    url:
      verified: "github.com/ojarosch/planlens"
    hooks:
      post:
        # Binary is not signed/notarized; strip quarantine so Gatekeeper
        # doesn't kill it on first run.
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/planlens"]
          end

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch
