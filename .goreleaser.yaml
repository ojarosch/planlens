version: 2

project_name: planlens

before:
  hooks:
    - go mod tidy

builds:
  - id: planlens
    main: ./cmd/planlens
    binary: planlens
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X planlens/internal/cli.Version={{.Version}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ title .Os }}_{{ if eq .Arch "amd64" }}x86_64{{ else if eq .Arch "arm64" }}aarch64{{ else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

brews:
  - name: planlens
    repository:
      owner: ojarosch
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/ojarosch/planlens"
    description: "Reviewer-oriented semantic diff for Terraform/OpenTofu plans"
    license: "Apache-2.0"
    install: |
      bin.install "planlens"
    test: |
      system "#{bin}/planlens", "--version"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch
